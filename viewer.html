<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review in Context</title>
<style>
:root{--ink:#1B1F24;--mute:#57606A;--line:#C9CED6;--edge:#8C959F;--panel:#F4F5F7;--blue:#1F5FBF;--blue-bg:#E8F0FB;--blue-ink:#174A96;--warn:#B45309;--warn-bg:#FFF4E5;--warn-ink:#8A3F06;--add:#E6FFEC;--add-edge:#1A7F37;--del:#FFEBE9;--del-edge:#CF222E;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font:15px/22px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--blue)}
button,textarea,input{font:inherit;color:inherit}
textarea{width:100%;padding:8px 10px;border:1px solid var(--edge);border-radius:8px;resize:vertical;background:#fff}
.wrap{max-width:1560px;margin:0 auto;padding:16px 56px 48px;display:flex;flex-direction:column;gap:14px}
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;background:var(--panel);border-radius:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:0 14px;border-radius:8px;border:1px solid var(--edge);background:#fff;color:var(--ink);font-weight:600;text-decoration:none;cursor:pointer}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.small{min-height:32px;padding:0 10px;font-size:13px}
.btn[disabled],.btn.off{opacity:.45;cursor:default;pointer-events:none}
.mono{font-family:var(--mono)}
.sub{font-size:13px;color:var(--mute)}
.badge{display:inline-flex;align-items:center;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;border:1px solid var(--edge);background:#fff;text-transform:uppercase;letter-spacing:.03em;white-space:nowrap}
.badge.added{background:var(--add);border-color:var(--add-edge)}
.badge.deleted{background:var(--del);border-color:var(--del-edge)}
.badge.attn{background:var(--warn-bg);border-color:var(--warn);color:var(--warn-ink)}
.filebar{display:flex;flex-direction:column;gap:8px;padding:10px 14px;border:1px solid var(--line);border-radius:12px}
.rowx{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.chip{display:inline-flex;align-items:center;min-height:36px;padding:0 10px;border-radius:8px;border:1px solid var(--edge);color:var(--ink);text-decoration:none;font-size:13px;max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.cur{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
.chip.done{color:var(--mute)}
.cap{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13px}
.step{padding:6px 10px;border:1px solid var(--line);border-radius:8px}
.step.here{background:var(--blue);border-color:var(--blue);color:#fff}
.step.changed{background:var(--blue-bg);border-color:var(--blue)}
.step.external{border-style:dashed;border-color:var(--edge);color:var(--mute)}
.jumps{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13px}
.jump{min-height:36px;padding:0 12px;border-radius:8px;border:1px solid var(--ink);background:#fff;font-weight:600;cursor:pointer}
.jump.attn{border:2px solid var(--warn);background:var(--warn-bg)}
.jump.sel{background:var(--ink);border-color:var(--ink);color:#fff}
.heads,.stage{display:grid;grid-template-columns:250px minmax(0,1fr) 250px;column-gap:56px}
.stage{position:relative}
.col{position:relative}
.pane{border:1px solid var(--edge);border-radius:10px;overflow:hidden;background:#fff}
.pane-head{height:36px;line-height:36px;padding:0 12px;background:var(--ink);color:#fff;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.code{height:clamp(420px,calc(100vh - 150px),1100px);overflow:auto;font:13px/22px var(--mono);outline:none;tab-size:2}
.code-inner{display:inline-block;min-width:100%}
.row{display:flex;height:22px;white-space:pre;padding-right:16px;color:var(--mute)}
.row.add{background:var(--add);color:var(--ink)}
.row.del{background:var(--del);color:var(--ink)}
.row.target{box-shadow:inset 0 0 0 2px var(--ink)}
.gut{flex:none;width:6px}
.row.chg .gut{background:var(--ink)}
.row.chg.attn .gut{background:var(--warn)}
.num{flex:none;width:52px;text-align:right;padding:0 10px 0 0;border:0;background:none;font:inherit;color:var(--mute);cursor:pointer}
.num:hover,.num:focus-visible{color:var(--ink);text-decoration:underline}
.sign{flex:none;width:18px;user-select:none;font-weight:700}
.ref{border:0;background:none;padding:0;font:inherit;color:var(--blue-ink);text-decoration:underline;cursor:pointer}
.mark{margin-left:16px;align-self:center;height:18px;line-height:16px;padding:0 8px;border-radius:999px;border:1px solid var(--ink);background:var(--ink);color:#fff;font:700 11px/16px system-ui,sans-serif;cursor:pointer}
.mark:empty{display:none}
.wires{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.card{position:absolute;left:0;width:100%;height:58px;padding:6px 12px;display:flex;flex-direction:column;justify-content:center;text-align:left;font-size:13px;line-height:19px;background:#fff;border:1px solid var(--edge);border-radius:10px;cursor:pointer;overflow:hidden}
.card b,.card span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.inpr{background:var(--blue-bg);border-color:var(--blue)}
.card.attn{background:var(--warn-bg);border:3px solid var(--warn)}
.card.ext{border-style:dashed;color:var(--mute)}
.card.none{border-style:dashed;color:var(--mute);cursor:default}
.hint{position:absolute;left:0;top:36px;width:100%;font-size:13px;line-height:19px;color:var(--mute)}
.card,.wires,.hint{transition:opacity .12s}
.stage.scrolling .card,.stage.scrolling .wires,.stage.scrolling .hint{opacity:0}
.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.note{padding:12px 16px;border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;gap:6px}
.note.ok{background:var(--blue-bg);border-color:var(--blue)}
.note.attention{background:var(--warn-bg);border:3px solid var(--warn)}
.k{font-size:12px;font-weight:700;color:var(--mute);text-transform:uppercase}
.legend{display:flex;flex-wrap:wrap;gap:18px;padding:12px 16px;background:var(--panel);border-radius:12px;font-size:13px}
.legend span{display:flex;align-items:center;gap:8px}
.sw{display:inline-block;width:14px;height:14px;border:1px solid var(--edge)}
.backdrop{position:fixed;left:0;top:0;width:100%;height:100%;border:0;padding:0;background:rgba(27,31,36,.12);z-index:20;cursor:default}
.drawer{position:fixed;top:64px;z-index:21;width:480px;max-width:94vw;max-height:calc(100vh - 88px);overflow:auto;padding:18px 22px;background:#fff;border:2px solid var(--ink);display:flex;flex-direction:column;gap:12px}
.drawer.left{left:0;border-left:0;border-radius:0 12px 12px 0;box-shadow:8px 8px 24px rgba(27,31,36,.2);animation:inl .18s ease-out}
.drawer.right{right:0;border-right:0;border-radius:12px 0 0 12px;box-shadow:-8px 8px 24px rgba(27,31,36,.2);animation:inr .18s ease-out}
.drawer.wide{width:560px}
@keyframes inl{from{transform:translateX(-32px);opacity:0}to{transform:none;opacity:1}}
@keyframes inr{from{transform:translateX(32px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.drawer{animation:none}.card,.wires,.hint{transition:none}}
.x{position:absolute;top:8px;right:8px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:8px;border:1px solid var(--edge);background:#fff;cursor:pointer}
.drawer h2{margin:0;padding-right:48px;min-height:32px;font:700 17px/24px system-ui,sans-serif;overflow-wrap:anywhere}
.drawer h2.mono{font:500 16px/24px var(--mono)}
.pre{margin-top:4px;padding:8px 12px;border-radius:8px;background:var(--panel);font:13px/20px var(--mono);white-space:pre;overflow-x:auto}
.snip{margin-top:6px;border:1px solid var(--edge);border-radius:8px;overflow-x:auto;font:12px/20px var(--mono)}
.snip div{padding:0 12px;white-space:pre;color:var(--mute)}
.snip div.hl{color:var(--ink);font-weight:600;background:var(--blue-bg);box-shadow:inset 0 0 0 2px var(--ink)}
.snip.attn div.hl{background:var(--warn-bg)}
.tabs{position:fixed;top:34vh;z-index:19;display:flex;flex-direction:column;gap:8px}
.tabs.l{left:0;align-items:flex-start}
.tabs.r{right:0;align-items:flex-end}
.tab{writing-mode:vertical-rl;min-width:40px;min-height:44px;padding:12px 8px;border:1px solid var(--ink);background:var(--ink);color:#fff;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.tabs.l .tab{border-left:0;border-radius:0 10px 10px 0}
.tabs.r .tab{border-right:0;border-radius:10px 0 0 10px}
.msg{padding:10px 12px;border-radius:10px;border:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.msg.claude{background:var(--blue-bg);border-color:var(--blue)}
.msg .txt,.txt{overflow-wrap:anywhere}
.md{display:flex;flex-direction:column;gap:8px}
.md p{margin:0;white-space:pre-wrap}
.md ul,.md ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:3px}
.md li>ul,.md li>ol{margin-top:3px}
.md .mh{font-weight:700;line-height:1.3}.md .mh1{font-size:17px}.md .mh2{font-size:16px}.md .mh3{font-size:15px}
.md blockquote{margin:0;padding:2px 0 2px 10px;border-left:3px solid var(--edge);color:var(--mute)}
.md hr{width:100%;border:0;border-top:1px solid var(--line);margin:2px 0}
.md .mtable{overflow-x:auto}.md table{border-collapse:collapse;font-size:13px}.md th,.md td{border:1px solid var(--line);padding:4px 8px;text-align:left;vertical-align:top}.md th{background:rgba(27,31,36,.06)}
.md .pre{white-space:pre;overflow-x:auto}
.drawer.chat{height:calc(100vh - 88px);overflow:hidden}
.drawer.chat>*{flex:none}
.drawer.chat>.thread{flex:1 1 auto;min-height:0;overflow-y:auto;padding-right:6px}
.drawer.chat textarea{resize:none;height:84px}
.drawer.chat textarea:disabled{background:var(--panel);color:var(--mute)}
.busy{align-items:center;gap:10px;padding:8px 12px;border-radius:8px;background:var(--blue-bg);border:1px solid var(--blue);font-weight:600;font-size:14px}
.busy.stuck{background:var(--warn-bg);border-color:var(--warn);color:var(--warn-ink)}
.spin{flex:none;width:14px;height:14px;border-radius:50%;border:2px solid var(--blue);border-top-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
.msg code,.txt code{font:13px var(--mono);background:rgba(27,31,36,.08);padding:1px 4px;border-radius:4px}
.anchor{align-self:flex-start;border:1px solid var(--edge);background:#fff;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thread{display:flex;flex-direction:column;gap:10px}
.idle{position:fixed;left:0;top:0;width:100%;height:100%;z-index:40;background:rgba(27,31,36,.45);display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}
.idle-card{max-width:440px;background:#fff;border-radius:12px;padding:22px 24px;display:flex;flex-direction:column;gap:12px;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.banner{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 16px;background:var(--warn-bg);border-top:2px solid var(--warn);font-weight:600;text-align:center}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);padding:8px 10px;border-bottom:1px solid var(--edge)}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
td a.file{font-family:var(--mono);font-size:13px;overflow-wrap:anywhere}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
@media (max-width:1000px){.heads,.stage{grid-template-columns:150px minmax(0,1fr) 150px;column-gap:28px}.wrap{padding:16px 16px 48px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="tabs"></div>
<div id="over"></div>
<script>window.REVIEW = /*__REVIEW_DATA__*/null;</script>
<script>
(function () {
  var R = window.REVIEW, app = document.getElementById('app'), over = document.getElementById('over'), tabsEl = document.getElementById('tabs');
  if (!R || !R.files) { app.textContent = 'No review data was embedded in this page.'; return; }
  var LH = 22, HEAD = 36, CARD = 58, GAP = 8, MAXCARDS = 4;
  var files = R.files, ents = R.entities || {}, pr = R.pr || {}, LIVE = window.RCC || null;
  var S = { reviewed: {}, comments: [], chat: [], submitted: null, listening: false, canPost: false, pr: {}, prComments: null };
  var TICKETS = [];
  var view = null, openRefresh = null, summaryDraft = '', verdict = 'COMMENT', offline = false, paused = false, pausedReason = '', active = false, idleShown = false, pausedShown = false;

  function h(tag, attrs, kids) {
    var el = document.createElement(tag), k;
    if (attrs) for (k in attrs) {

      else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), attrs[k]);
      else el.setAttribute(k, attrs[k] === true ? '' : attrs[k]);
    }
    (kids || []).forEach(function (c) { if (c != null && c !== false) el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return el;
  }
  function svg(tag, attrs) { var el = document.createElementNS('http://www.w3.org/2000/svg', tag), k; for (k in attrs) el.setAttribute(k, attrs[k]); return el; }
  function base(p) { return String(p).split('/').pop(); }
  function fileIndex(p) { for (var i = 0; i < files.length; i++) if (files[i].path === p) return i; return -1; }
  function nDone() { return files.filter(function (f) { return S.reviewed[f.path]; }).length; }
  function attnCount(f) { return (f.changes || []).filter(function (c) { return c.level === 'attention'; }).length; }
  // Small, safe Markdown renderer: builds DOM nodes only, never sets innerHTML.
  function inline(parent, s) {
    var re = /(`+)([\s\S]+?)\1|\*\*([^\n]+?)\*\*|__([^\n]+?)__|\*([^\s*][^\n*]*?)\*|\b_([^\s_][^\n_]*?)_\b|\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)|(https?:\/\/[^\s<>)\]]+)/g, last = 0, m;
    while ((m = re.exec(s))) {
      if (m.index > last) parent.appendChild(document.createTextNode(s.slice(last, m.index)));
      if (m[2] != null) parent.appendChild(h('code', { text: m[2] }));
      else if (m[3] != null || m[4] != null) inline(parent.appendChild(h('strong')), m[3] != null ? m[3] : m[4]);
      else if (m[5] != null || m[6] != null) inline(parent.appendChild(h('em')), m[5] != null ? m[5] : m[6]);
      else if (m[7] != null) parent.appendChild(h('a', { href: m[8], target: '_blank', rel: 'noopener', text: m[7] }));
      else parent.appendChild(h('a', { href: m[9], target: '_blank', rel: 'noopener', text: m[9] }));

    }
    if (last < s.length) parent.appendChild(document.createTextNode(s.slice(last)));
    return parent;
  }
  function rich(text) {
    var out = h('div', { class: 'txt md' }), lines = String(text == null ? '' : text).replace(/\r/g, '').split('\n'), i = 0, m;
    var isList = function (l) { return /^\s*([-*+]|\d+[.)])\s+/.exec(l); };
    var cells = function (l) { return l.trim().replace(/^\||\|$/g, '').split('|').map(function (c) { return c.trim(); }); };
    while (i < lines.length) {
      var l = lines[i];
      if (!l.trim()) { i++; continue; }
      if ((m = /^\s*(```|~~~)/.exec(l))) {
        var buf = []; i++;
        while (i < lines.length && lines[i].trim().indexOf(m[1]) !== 0) buf.push(lines[i++]);
        i++; out.appendChild(h('div', { class: 'pre', text: buf.join('\n') })); continue;
      }
      if ((m = /^(#{1,6})\s+(.*)$/.exec(l))) { inline(out.appendChild(h('div', { class: 'mh mh' + Math.min(m[1].length, 3) })), m[2].replace(/\s+#+\s*$/, '')); i++; continue; }
      if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(l)) { out.appendChild(h('hr')); i++; continue; }
      if (/^\s*>/.test(l)) {
        var q = [];
        while (i < lines.length && /^\s*>/.test(lines[i])) q.push(lines[i++].replace(/^\s*>\s?/, ''));
        var bq = h('blockquote'); bq.appendChild(rich(q.join('\n'))); out.appendChild(bq); continue;
      }
      if (l.indexOf('|') >= 0 && i + 1 < lines.length && /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(lines[i + 1])) {
        var head = cells(l), tb = h('tbody'); i += 2;
        while (i < lines.length && lines[i].indexOf('|') >= 0 && lines[i].trim()) { var tr = h('tr'); cells(lines[i++]).forEach(function (c) { inline(tr.appendChild(h('td')), c); }); tb.appendChild(tr); }
        var htr = h('tr'); head.forEach(function (c) { inline(htr.appendChild(h('th')), c); });
        out.appendChild(h('div', { class: 'mtable' }, [h('table', null, [h('thead', null, [htr]), tb])])); continue;
      }
      if (isList(l)) {
        var stack = [];
        while (i < lines.length && (isList(lines[i]) || (/^\s+\S/.test(lines[i]) && stack.length))) {

          if (!lm) { var li0 = stack[stack.length - 1].last; if (li0) { li0.appendChild(document.createTextNode(' ')); inline(li0, lines[i].trim()); } i++; continue; }

    }
    return out;
  }

  function ago(t) { var ms = typeof t === 'number' ? t : Date.parse(t); if (!ms) return ''; var s = Math.max(0, Math.round((Date.now() - ms) / 1000)); if (s < 60) return 'just now'; var m = Math.round(s / 60); if (m < 60) return m + ' min ago'; var hh = Math.round(m / 60); if (hh < 48) return hh + ' h ago'; return Math.round(hh / 24) + ' days ago'; }
  function prLine() { return S.prComments && S.prComments.line ? S.prComments.line : []; }
  function rowFor(p, line, side) {
    var i = fileIndex(p); if (i < 0) return -1;
    var ls = files[i].lines || [], del = files[i].status === 'deleted';
    for (var r = 0; r < ls.length; r++) { if (side === 'LEFT' ? ((ls[r].k === '-' || del) && ls[r].o === line) : (ls[r].k !== '-' && ls[r].n === line)) return r; }
    return -1;
  }
  function api(route, body) {
    if (!LIVE) return Promise.reject(new Error('not live'));
    return fetch('/api/' + route, { method: body ? 'POST' : 'GET', headers: { 'content-type': 'application/json', 'x-rcc-token': LIVE.token }, body: body ? JSON.stringify(body) : undefined })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
  }
  function setOffline(v) {
    offline = v; banner();
  }
  var PAUSE_TEXT = 'Session paused. Everything is saved. When you are back, run /review-code-in-context --resume in the terminal.';
  function banner() {
    var text = paused ? (pausedReason === 'idle' ? 'Session paused because there was no activity for ' + (S.idleMinutes || 30) + ' minutes. Everything is saved. Run /review-code-in-context --resume in the terminal to continue.' : PAUSE_TEXT) : offline ? 'The review server has stopped, so chat and comments are paused. In the terminal, run /review-code-in-context --resume' : '';
    var b = document.getElementById('banner');
    if (!text) { if (b) b.remove(); return; }
    if (!b) { b = h('div', { id: 'banner', class: 'banner' }); document.body.appendChild(b); }
    b.textContent = text;
    if (paused && !pausedShown) pausedBox(); if (!paused) { pausedShown = false; var pb = document.getElementById('paused'); if (pb) pb.remove(); }
    Array.prototype.forEach.call(document.querySelectorAll('.pause-btn'), function (x) { x.disabled = paused; x.textContent = paused ? 'Paused' : 'Pause session'; });
  }
  function pauseSession() {
    if (!LIVE || paused) return;
    api('finish', { paused: true }).then(function () { paused = true; pausedReason = ''; banner(); }).catch(function () { setOffline(true); });
  }
  var RESUME_CMD = '/review-code-in-context --resume';
  function pausedBox() {
    pausedShown = true; idleBox(null);

  if (LIVE) { pull().then(function () { route(); }); loadTickets(); setInterval(pull, 1500); }
})();
</script>
