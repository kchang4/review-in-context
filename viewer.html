<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review in Context</title>
<style>
:root{--syn-comment:#57606a;--syn-keyword:#cf222e;--syn-entity:#8250df;--syn-constant:#0550ae;--syn-string:#0a3069;--syn-variable:#953800;--syn-tag:#116329;--bg:#fff;--strong:#1B1F24;--on-strong:#fff;--link:#1F5FBF;--shade:rgba(27,31,36,.08);--scrim:rgba(27,31,36,.12);--frame:#1B1F24;--wire-g:#6E7781;--wire-b:#1F5FBF;--wire-w:#B45309;color-scheme:light;--ink:#1B1F24;--mute:#57606A;--line:#C9CED6;--edge:#8C959F;--panel:#F4F5F7;--blue:#1F5FBF;--blue-bg:#E8F0FB;--blue-ink:#174A96;--warn:#B45309;--warn-bg:#FFF4E5;--warn-ink:#8A3F06;--add:#E6FFEC;--add-edge:#1A7F37;--del:#FFEBE9;--del-edge:#CF222E;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
:root[data-theme=dark]{--syn-comment:#8b949e;--syn-keyword:#ff7b72;--syn-entity:#d2a8ff;--syn-constant:#79c0ff;--syn-string:#a5d6ff;--syn-variable:#ffa657;--syn-tag:#7ee787;--bg:#0F1318;--ink:#E6EDF3;--mute:#9DA7B3;--line:#30363D;--edge:#6E7781;--panel:#171C23;--blue:#2F6FDE;--blue-bg:#14294A;--blue-ink:#A8C7FA;--link:#79B0FF;--warn:#D9822B;--warn-bg:#3A2A12;--warn-ink:#F2BD7A;--add:#12351F;--add-edge:#3FB950;--del:#4A1D1F;--del-edge:#F85149;--strong:#3A424C;--on-strong:#fff;--shade:rgba(255,255,255,.1);--scrim:rgba(0,0,0,.45);--frame:#8C959F;--wire-g:#8C959F;--wire-b:#79B0FF;--wire-w:#E0953F;color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--syn-comment:#8b949e;--syn-keyword:#ff7b72;--syn-entity:#d2a8ff;--syn-constant:#79c0ff;--syn-string:#a5d6ff;--syn-variable:#ffa657;--syn-tag:#7ee787;--bg:#0F1318;--ink:#E6EDF3;--mute:#9DA7B3;--line:#30363D;--edge:#6E7781;--panel:#171C23;--blue:#2F6FDE;--blue-bg:#14294A;--blue-ink:#A8C7FA;--link:#79B0FF;--warn:#D9822B;--warn-bg:#3A2A12;--warn-ink:#F2BD7A;--add:#12351F;--add-edge:#3FB950;--del:#4A1D1F;--del-edge:#F85149;--strong:#3A424C;--on-strong:#fff;--shade:rgba(255,255,255,.1);--scrim:rgba(0,0,0,.45);--frame:#8C959F;--wire-g:#8C959F;--wire-b:#79B0FF;--wire-w:#E0953F;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/22px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--link)}
button,textarea,input{font:inherit;color:inherit}
textarea{width:100%;padding:8px 10px;border:1px solid var(--edge);border-radius:8px;resize:vertical;background:var(--bg)}
.wrap{max-width:1560px;margin:0 auto;padding:16px 56px 48px;display:flex;flex-direction:column;gap:14px}
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;background:var(--panel);border-radius:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:0 14px;border-radius:8px;border:1px solid var(--edge);background:var(--bg);color:var(--ink);font-weight:600;text-decoration:none;cursor:pointer}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--on-strong)}
.btn.small{min-height:32px;padding:0 10px;font-size:13px}
.btn[disabled],.btn.off{opacity:.45;cursor:default;pointer-events:none}
.mono{font-family:var(--mono)}
.sub{font-size:13px;color:var(--mute)}
.badge{display:inline-flex;align-items:center;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;border:1px solid var(--edge);background:var(--bg);text-transform:uppercase;letter-spacing:.03em;white-space:nowrap}
.badge.added{background:var(--add);border-color:var(--add-edge)}
.badge.deleted{background:var(--del);border-color:var(--del-edge)}
.badge.attn{background:var(--warn-bg);border-color:var(--warn);color:var(--warn-ink)}
.filebar{display:flex;flex-direction:column;gap:8px;padding:10px 14px;border:1px solid var(--line);border-radius:12px}
.rowx{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.chip{display:inline-flex;align-items:center;min-height:36px;padding:0 10px;border-radius:8px;border:1px solid var(--edge);color:var(--ink);text-decoration:none;font-size:13px;max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.cur{background:var(--strong);border-color:var(--strong);color:var(--on-strong);font-weight:600}
.chip.done{color:var(--mute)}
.cap{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13px}
.step{padding:6px 10px;border:1px solid var(--line);border-radius:8px;white-space:nowrap;font:inherit;background:transparent;color:inherit;text-align:left}
button.step{cursor:pointer}
button.step:hover{border-color:var(--blue)}
button.step[aria-expanded=true]{outline:2px solid var(--blue);outline-offset:1px}
.flow-detail{margin-top:2px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);font-size:14px}
.flow-detail[hidden]{display:none}
.step.here{background:var(--blue);border-color:var(--blue);color:var(--on-strong)}
.step.changed{background:var(--blue-bg);border-color:var(--blue)}
.step.external{border-style:dashed;border-color:var(--edge);color:var(--mute)}
.jumps{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:13px}
.jump{min-height:36px;padding:0 12px;border-radius:8px;border:1px solid var(--ink);background:var(--bg);font-weight:600;cursor:pointer}
.jump.attn{border:2px solid var(--warn);background:var(--warn-bg)}
.jump.sel{background:var(--strong);border-color:var(--strong);color:var(--on-strong)}
.heads,.stage{display:grid;grid-template-columns:250px minmax(0,1fr) 250px;column-gap:56px}
.stage{position:relative}
.stagewrap{display:flex;flex-direction:column;gap:14px}
.heads{position:sticky;top:0;z-index:6;background:var(--bg);padding:6px 0}
.heads.pinned{box-shadow:0 1px 0 var(--line)}
.col{position:relative}
.pane{border:1px solid var(--edge);border-radius:10px;overflow:hidden;background:var(--bg)}
.pane-head{height:36px;line-height:36px;padding:0 12px;background:var(--strong);color:var(--on-strong);font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.code{height:clamp(420px,calc(100vh - 150px),1100px);overflow:auto;font:13px/22px var(--mono);outline:none;tab-size:2}
.code-inner{position:relative;min-width:100%}
.code-win{position:absolute;left:0;right:0;top:0}
.row{display:flex;height:22px;white-space:pre;padding-right:16px;color:var(--mute)}
.row.add{background:var(--add);color:var(--ink)}
.row.del{background:var(--del);color:var(--ink)}
.row.target{box-shadow:inset 0 0 0 2px var(--ink)}
.gut{flex:none;width:6px}
.row.chg .gut{background:var(--strong)}
.row.chg.attn .gut{background:var(--warn)}
.num{flex:none;width:52px;text-align:right;padding:0 10px 0 0;border:0;background:none;font:inherit;color:var(--mute);cursor:pointer}
.num:hover,.num:focus-visible{color:var(--ink);text-decoration:underline}
.sign{flex:none;width:18px;user-select:none;font-weight:700}
.tc{color:var(--syn-comment)}.tk{color:var(--syn-keyword)}.te{color:var(--syn-entity)}.tn{color:var(--syn-constant)}.ts{color:var(--syn-string)}.tv{color:var(--syn-variable)}.tt{color:var(--syn-tag)}
.code-inner.hl .row{color:var(--ink)}
.ref .tc,.ref .tk,.ref .te,.ref .tn,.ref .ts,.ref .tv,.ref .tt{color:inherit}
.ref{border:0;background:none;padding:0;font:inherit;color:var(--blue-ink);text-decoration:underline;cursor:pointer}
.mark{margin-left:16px;align-self:center;height:18px;line-height:16px;padding:0 8px;border-radius:999px;border:1px solid var(--strong);background:var(--strong);color:var(--on-strong);font:700 11px/16px system-ui,sans-serif;cursor:pointer}
.mark:empty{display:none}
.wires{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.card{position:absolute;left:0;width:100%;height:58px;padding:6px 12px;display:flex;flex-direction:column;justify-content:center;text-align:left;font-size:13px;line-height:19px;background:var(--bg);border:1px solid var(--edge);border-radius:10px;cursor:pointer;overflow:hidden}
.card b,.card span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.inpr{background:var(--blue-bg);border-color:var(--blue)}
.card.attn{background:var(--warn-bg);border:3px solid var(--warn)}
.card.ext{border-style:dashed;color:var(--mute)}
.card.none{border-style:dashed;color:var(--mute);cursor:default}
.hint{position:absolute;left:0;top:36px;width:100%;font-size:13px;line-height:19px;color:var(--mute)}
.card,.wires,.hint{transition:opacity .12s}
.stage.scrolling .card,.stage.scrolling .wires,.stage.scrolling .hint{opacity:0}
.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
.note{padding:12px 16px;border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;gap:6px}
.note.ok{background:var(--blue-bg);border-color:var(--blue)}
.note.attention{background:var(--warn-bg);border:3px solid var(--warn)}
.k{font-size:12px;font-weight:700;color:var(--mute);text-transform:uppercase}
.legend{display:flex;flex-wrap:wrap;gap:18px;padding:12px 16px;background:var(--panel);border-radius:12px;font-size:13px}
.legend span{display:flex;align-items:center;gap:8px}
.sw{display:inline-block;width:14px;height:14px;border:1px solid var(--edge)}
.backdrop{position:fixed;left:0;top:0;width:100%;height:100%;border:0;padding:0;background:var(--scrim);z-index:20;cursor:default}
.drawer{position:fixed;top:64px;z-index:21;width:480px;max-width:94vw;max-height:calc(100vh - 88px);overflow:auto;padding:18px 22px;background:var(--bg);border:2px solid var(--frame);display:flex;flex-direction:column;gap:12px}
.drawer.left{left:0;border-left:0;border-radius:0 12px 12px 0;box-shadow:8px 8px 24px rgba(27,31,36,.2);animation:inl .18s ease-out}
.drawer.right{right:0;border-right:0;border-radius:12px 0 0 12px;box-shadow:-8px 8px 24px rgba(27,31,36,.2);animation:inr .18s ease-out}
.drawer.wide{width:560px}
@keyframes inl{from{transform:translateX(-32px);opacity:0}to{transform:none;opacity:1}}
@keyframes inr{from{transform:translateX(32px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.drawer{animation:none}.card,.wires,.hint{transition:none}}
.x{color:var(--ink);position:absolute;top:8px;right:8px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:8px;border:1px solid var(--edge);background:var(--bg);cursor:pointer}
.drawer h2{margin:0;padding-right:48px;min-height:32px;font:700 17px/24px system-ui,sans-serif;overflow-wrap:anywhere}
.drawer h2.mono{font:500 16px/24px var(--mono)}
.pre{margin-top:4px;padding:8px 12px;border-radius:8px;background:var(--panel);font:13px/20px var(--mono);white-space:pre;overflow-x:auto}
.snip{margin-top:6px;border:1px solid var(--edge);border-radius:8px;overflow-x:auto;font:12px/20px var(--mono)}
.snip div{padding:0 12px;white-space:pre;color:var(--mute)}
.snip div.hl{color:var(--ink);font-weight:600;background:var(--blue-bg);box-shadow:inset 0 0 0 2px var(--ink)}
.snip.attn div.hl{background:var(--warn-bg)}
.tabs{position:fixed;top:34vh;z-index:19;display:flex;flex-direction:column;gap:8px}
.tabs.l{left:0;align-items:flex-start}
.tabs.r{right:0;align-items:flex-end}
.tab{writing-mode:vertical-rl;min-width:40px;min-height:44px;padding:12px 8px;border:1px solid var(--strong);background:var(--strong);color:var(--on-strong);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.tabs.l .tab{border-left:0;border-radius:0 10px 10px 0}
.tabs.r .tab{border-right:0;border-radius:10px 0 0 10px}
.msg{padding:10px 12px;border-radius:10px;border:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.msg.claude{background:var(--blue-bg);border-color:var(--blue)}
.msg .txt,.txt{overflow-wrap:anywhere}
.md{display:flex;flex-direction:column;gap:8px}
.md p{margin:0;white-space:pre-wrap}
.md ul,.md ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:3px}
.md li>ul,.md li>ol{margin-top:3px}
.md .mh{font-weight:700;line-height:1.3}.md .mh1{font-size:17px}.md .mh2{font-size:16px}.md .mh3{font-size:15px}
.md blockquote{margin:0;padding:2px 0 2px 10px;border-left:3px solid var(--edge);color:var(--mute)}
.md hr{width:100%;border:0;border-top:1px solid var(--line);margin:2px 0}
.md .mtable{overflow-x:auto}.md table{border-collapse:collapse;font-size:13px}.md th,.md td{border:1px solid var(--line);padding:4px 8px;text-align:left;vertical-align:top}.md th{background:var(--shade)}
.md .pre{white-space:pre;overflow-x:auto}
.drawer.chat{height:calc(100vh - 88px);overflow:hidden}
.drawer.chat>*{flex:none}
.drawer.chat>.thread{flex:1 1 auto;min-height:0;overflow-y:auto;padding-right:6px}
.drawer.chat textarea{resize:none;height:84px}
.drawer.chat textarea:disabled{background:var(--panel);color:var(--mute)}
.busy{align-items:center;gap:10px;padding:8px 12px;border-radius:8px;background:var(--blue-bg);border:1px solid var(--blue);font-weight:600;font-size:14px}
.busy.stuck{background:var(--warn-bg);border-color:var(--warn);color:var(--warn-ink)}
.spin{flex:none;width:14px;height:14px;border-radius:50%;border:2px solid var(--blue);border-top-color:transparent;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
.msg code,.txt code{font:13px var(--mono);background:var(--shade);padding:1px 4px;border-radius:4px}
.anchor{align-self:flex-start;border:1px solid var(--edge);background:var(--bg);border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thread{display:flex;flex-direction:column;gap:10px}
.idle{position:fixed;left:0;top:0;width:100%;height:100%;z-index:40;background:rgba(27,31,36,.45);display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}
.idle-card{max-width:440px;background:var(--bg);border-radius:12px;padding:22px 24px;display:flex;flex-direction:column;gap:12px;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.banner{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 16px;background:var(--warn-bg);border-top:2px solid var(--warn);font-weight:600;text-align:center}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);padding:8px 10px;border-bottom:1px solid var(--edge)}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
td a.file{font-family:var(--mono);font-size:13px;overflow-wrap:anywhere}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
.story{display:flex;flex-direction:column;gap:10px}
.lanes{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg)}
.lane{display:flex;border-bottom:1px solid var(--line)}
.lane:last-child{border-bottom:0}
.lab{width:124px;flex:none;padding:10px;color:#fff;display:flex;flex-direction:column;justify-content:center;gap:2px}
.lab b{font-size:13px;letter-spacing:.05em;font-weight:800}
.lab span{font-size:11px;opacity:.92}
.lsteps{padding:10px 12px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;min-width:0}
.sstep{display:inline-flex;align-items:center;gap:8px;padding:6px 10px;border:1px solid var(--lc);border-radius:8px;background:color-mix(in srgb,var(--lc) 12%,var(--bg));color:var(--ink);font-size:13px;cursor:pointer;text-align:left}
.sstep.ext{border-style:dashed;background:var(--bg)}
.sstep.here{background:var(--strong);border-color:var(--strong);color:var(--on-strong)}
.sstep.sel{outline:3px solid var(--ink);outline-offset:1px}
.snum{flex:none;width:22px;height:22px;border-radius:50%;background:var(--lc);color:#fff;font-weight:800;font-size:12px;display:inline-flex;align-items:center;justify-content:center}
.sstep.here .snum{background:#fff;color:#1B1F24}
.schg{font-size:11px;opacity:.8}
.shand{display:flex;gap:10px;align-items:center;flex-wrap:wrap;width:100%;padding:8px 12px 8px 136px;background:var(--panel);border:0;border-bottom:1px solid var(--line);color:var(--ink);font:inherit;font-size:13px;text-align:left;cursor:pointer}
.shand.sel{outline:3px solid var(--ink);outline-offset:-3px}
.pill{background:var(--strong);color:var(--on-strong);font-weight:700;font-size:11px;letter-spacing:.04em;padding:3px 10px;border-radius:999px;white-space:nowrap}
.shand small{font-size:12.5px;color:var(--mute)}
.arrow{color:var(--mute)}
.lanes.compact .lsteps{padding:6px 10px}
.lanes.compact .lab{padding:6px 10px}
.lanes.compact .shand{padding-top:4px;padding-bottom:4px}
.sdetail{padding:14px 16px;border:1px solid var(--line);border-left:6px solid var(--lc);border-radius:10px;background:var(--panel);display:flex;flex-direction:column;gap:6px}
.sdetail h3{margin:0;font-size:17px;line-height:24px}
.srow{display:flex;gap:10px}
.srow>b{flex:none;width:96px;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);padding-top:2px}
.srow>div{min-width:0}
.sfiles{display:flex;flex-wrap:wrap;gap:6px 14px}
.sfiles .cur{font-weight:700}
.term{border:0;background:none;padding:0;font:inherit;color:var(--blue-ink);border-bottom:2px dotted var(--blue);cursor:pointer;font-weight:600}
.term:hover,.term:focus-visible{background:var(--blue-bg)}
.termpop{position:fixed;z-index:25;width:380px;max-width:94vw;background:var(--bg);color:var(--ink);border:2px solid var(--blue);border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.28);overflow:hidden;font-size:14px;line-height:21px}
.tp-h{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--blue);color:#fff}
.tp-h span{font-size:11px;opacity:.95;margin-left:auto}
.tp-x{border:0;background:none;color:#fff;font-size:20px;line-height:1;cursor:pointer;padding:0 2px}
.tp-b{padding:12px}
@media (max-width:1000px){.lab{width:96px}.shand{padding-left:108px}}
@media (max-width:1000px){.heads,.stage{grid-template-columns:150px minmax(0,1fr) 150px;column-gap:28px}.wrap{padding:16px 16px 48px}}
</style>
